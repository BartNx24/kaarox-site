<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Kaarox browser/tab icon -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/KaaRox_logo.png"
    />

    <link
      rel="shortcut icon"
      href="/assets/KaaRox_logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/assets/KaaRox_logo.png"
    />

    <!-- Canonical production URL -->
    <link
      rel="canonical"
      href="https://www.kaarox.com/"
    />

    <title>Kaarox</title>

    <meta
      name="description"
      content="Connect with professionals, discover services, and grow your digital network."
    />

    <meta
      name="author"
      content="Kaarox"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Kaarox"
    />

    <meta
      property="og:description"
      content="Connect with professionals, discover services, and grow your digital network."
    />

    <meta
      property="og:image"
      content="https://www.kaarox.com/assets/KaaRox_logo.png"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://www.kaarox.com/"
    />

    <meta
      property="og:site_name"
      content="Kaarox"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Kaarox"
    />

    <meta
      name="twitter:description"
      content="Connect with professionals, discover services, and grow your digital network."
    />

    <meta
      name="twitter:image"
      content="https://www.kaarox.com/assets/KaaRox_logo.png"
    />

    <!-- Sitemap -->
    <link
      rel="sitemap"
      type="application/xml"
      title="Sitemap"
      href="/sitemap.xml"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
