name: Deploy Kaarox Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: "Kaarox Hero Landing/app/frontend"
        run: npm ci

      - name: Build
        working-directory: "Kaarox Hero Landing/app/frontend"
        run: npm run build

      - name: Include deletion pages and supporting files
        shell: bash
        run: |
          site_dir="Kaarox Hero Landing/app/frontend/dist"

          test -s "$site_dir/index.html"

          cp -- \
            data-deletion-policy.html \
            take-it-down.html \
            privacy.html \
            terms.html \
            legal.css \
            KaaRox_logo.png \
            "$site_dir/"

          test -s "$site_dir/data-deletion-policy.html"
          test -s "$site_dir/take-it-down.html"
          test -s "$site_dir/privacy.html"
          test -s "$site_dir/terms.html"
          test -s "$site_dir/legal.css"
          test -s "$site_dir/KaaRox_logo.png"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "Kaarox Hero Landing/app/frontend/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
